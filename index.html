<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kaarttruc — Reünie Boschjes 2025</title>
  <style>
    :root{--bg:#0b1220;--card:#fff;--text:#071226;--accent:#0ea5a4}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
    body{background:linear-gradient(180deg,#071124 0%,var(--bg) 100%);color:#eaf6fb;display:flex;align-items:center;justify-content:center;padding:28px}
    .app{width:100%;max-width:820px;text-align:center}
    h1{margin:0;font-size:20px}
    p.lead{margin:8px 0 18px;color:#b7d6e1}

    /* card grid */
    #cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

    .card{
      width:110px;height:156px;border-radius:12px;background:var(--card);color:var(--text);display:flex;flex-direction:column;justify-content:space-between;padding:10px;box-shadow:0 8px 28px rgba(2,6,23,.6);
      user-select:none;cursor:default;position:relative;transition:transform .25s ease,opacity .2s ease;
    }
    .rank{font-size:22px;font-weight:700}
    .suit{font-size:60px;line-height:1;align-self:center;}
    .red{color:#c33}
    .black{color:#222}

    .controls{margin-top:18px;display:flex;gap:10px;justify-content:center}
    button{background:transparent;border:1px solid rgba(255,255,255,.08);color:inherit;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.primary{background:var(--accent);color:#032222;border:none}

    footer{margin-top:18px;color:#7f9fb7;font-size:12px}

    @media (max-width:480px){.card{width:84px;height:122px}.suit{font-size:44px}.rank{font-size:18px}}
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="6 cards trick">
    <header>
      <h1>Reünie Boschjes 2025</h1>
      <p class="lead" id="instruction">Kies één kaart in gedachten — denk goed welke het is. Klik daarna op "Verder".</p>
    </header>

    <main>
      <div id="cards" aria-live="polite"></div>

      <div class="controls">
        <button id="resetBtn">Reset</button>
        <button id="nextBtn" class="primary">Verder</button>
        <button id="downloadBtn">Download HTML</button>
      </div>

      <footer>© Reünie Boschjes — interactive demo</footer>
    </main>
  </div>

  <script>
    // Minimalist card rendering using CSS and text (no external images). Works fully offline.
    const initial = [
      {r:'A', s:'♠', color:'black'},
      {r:'K', s:'♥', color:'red'},
      {r:'Q', s:'♣', color:'black'},
      {r:'2', s:'♦', color:'red'},
      {r:'7', s:'♥', color:'red'},
      {r:'J', s:'♣', color:'black'}
    ];

    // second set deliberately does NOT contain any of the original cards
    const second = [
      {r:'3', s:'♠', color:'black'},
      {r:'9', s:'♥', color:'red'},
      {r:'5', s:'♣', color:'black'},
      {r:'Q', s:'♦', color:'red'},
      {r:'8', s:'♠', color:'black'}
    ];

    const cardsDiv = document.getElementById('cards');
    const instr = document.getElementById('instruction');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    function render(set){
      cardsDiv.innerHTML='';
      set.forEach(c=>{
        const el = document.createElement('div');
        el.className='card';
        const top = document.createElement('div'); top.className='rank'; top.textContent = c.r;
        const mid = document.createElement('div'); mid.className='suit ' + (c.color==='red'? 'red':'black'); mid.textContent = c.s;
        const bot = document.createElement('div'); bot.className='rank'; bot.textContent = c.r;
        el.appendChild(top); el.appendChild(mid); el.appendChild(bot);
        cardsDiv.appendChild(el);
      });
    }

    let step = 0;
    render(initial);

    nextBtn.addEventListener('click', ()=>{
      if(step===0){
        instr.textContent = 'En nu... is jouw kaart verdwenen!';
        // quick fade out + replace
        cardsDiv.style.opacity = 0;
        setTimeout(()=>{
          render(second);
          cardsDiv.style.opacity = 1;
        },300);
        nextBtn.disabled = true; // one-time reveal
      }
      step++;
    });

    resetBtn.addEventListener('click', ()=>{
      step = 0; nextBtn.disabled = false; instr.textContent='Kies één kaart in gedachten — denk goed welke het is. Klik daarna op "Verder".'; render(initial);
    });

    downloadBtn.addEventListener('click', ()=>{
      const content = '<!doctype html>\\n' + document.documentElement.outerHTML;
      const blob = new Blob([content],{type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'kaarttruc_reunie_boschjes_2025.html'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
